<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">
    

    <title>{% block title %}epaData{% endblock %}</title>
    <!--border-radius: 15px;-->

    <!-- style -->
    <style>
        * {
            box-sizing: border-box;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;

            background-color: #251101;
            padding: 20px; 

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar a {
            margin-left: 25px;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .logout {
            position: fixed;
            bottom: 0;
            width: 240px;
            height: 50px;
            padding: 10px;
            background-color: #2d71bdff;
            font-size: 12px;
            color: white;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #1f2933;
        }

        nav {
            background-color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav .welcome-bar {
            margin-left: auto;
            font-size: 8px;
            color: white;
            background-color: #251101;
            padding: 2px 130px;
            border-radius: 15px;
        }

        nav a {
            color: #251101;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .hero h1 {
            color: #251101;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #52616b;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            margin: 5px;
            background-color: #251101;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #251101;
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- top navigation -->
    <nav>
        <h1>Data Overview</h2>
        <div class="welcome-bar">
            <!-- *** Can add a variable for the username HERE *** -->
            <h1>Welcome!</h1> 
        </div>
        <a href="/login">Login</a>
    </nav>


    <!-- sidebar -->
    <div class="sidebar"> 
        <!-- logo -->
        <img src="{{ url_for('static', filename='EPALogo.png') }}"
            alt="EPA Logo"
            width="200"
            height="140">

        <!-- links to the other web pages go here -->
         <br>
         <a href="/search">Search</a>
         <br>
         <a href="/display">Data Display</a>
         <br>
         <a href="/download">Data Download</a>
         <br>
         <a href="/upload">Upload Data</a>
         <br>
         <a href="/edits">Edit Data</a> <!-- ADMINS ONLY -->

        <!-- logout button -->
         <div class="logout">
            <a href="/logout">logout</a>
         </div>

    </div>
   
    <!-- Page-specific content goes here -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        epaData — EPA Data Management, Evaluation, and Visualization System
    </footer>

</body>
</html>
