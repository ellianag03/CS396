<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}epaData{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #1f2933;
        }

        nav {
            background-color: #1f4d3a;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav .brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-right: auto;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero {
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .hero h1 {
            color: #1f4d3a;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            color: #52616b;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            margin: 5px;
            background-color: #2f7d52;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #256342;
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="brand">epaData</div>

        <a href="/">Home</a>
        <a href="/retrieval">Retrieve</a>
        <a href="/upload">Upload</a>
        <a href="/explorer">Data Explorer</a>
        <a href="/download">Download</a>
    </nav>

   

    <footer>
        epaData — EPA Data Management, Evaluation, and Visualization System
    </footer>

</body>
</html>
